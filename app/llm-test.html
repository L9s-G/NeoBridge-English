<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LLM 测试台 · NeoBridge</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./app.css">
<style>
  /* 开发专用 · 只考虑 PC 横向版面：左 1/3 输入+日志，右 2/3 输出 */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }

  .top {
    display: flex; align-items: baseline; gap: 1rem;
    padding: .7rem 1rem; border-bottom: 1px solid var(--border);
  }
  .top .title { margin: 0; font-size: 1.15rem; }
  .top .meta { color: var(--text-dim); font-size: .82rem; }
  .top .back { margin-left: auto; color: var(--text-dim); text-decoration: none; font-size: .9rem; }
  .top .back:hover { color: var(--accent); }

  .shell {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: minmax(340px, 1fr) 2fr;
    gap: 1rem; padding: 1rem;
  }
  @media (max-width: 960px) { .shell { grid-template-columns: 1fr; } }

  .left { display: flex; flex-direction: column; gap: .8rem; min-height: 0; min-width: 0; }
  .right { overflow: auto; min-width: 0; }

  .panel {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: .75rem; padding: .8rem 1rem;
  }
  .panel h2 { margin: 0 0 .5rem; font-size: .95rem; color: var(--text-dim); font-weight: 600; }

  textarea, input[type=text], input[type=url], input[type=password] {
    width: 100%; box-sizing: border-box;
    background: var(--bg); color: var(--text); border: 1px solid var(--border-strong);
    border-radius: .5rem; padding: .5rem .6rem; font: inherit;
  }
  textarea { resize: vertical; min-height: 5.5rem; font: 14px/1.6 ui-monospace, Consolas, monospace; }
  input.mono { font-family: ui-monospace, Consolas, monospace; }

  .row { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
  .row + .row { margin-top: .55rem; }
  label.opt { color: var(--text-dim); font-size: .85rem; display: inline-flex; align-items: center; gap: .3rem; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem .7rem; }
  .grid2 label { display: flex; flex-direction: column; gap: .2rem; color: var(--text-dim); font-size: .8rem; }
  .dim { color: var(--text-dim); font-size: .82rem; }
  .tag {
    display: inline-block; padding: .1rem .55rem; border-radius: 999px;
    font-size: .78rem; border: 1px solid var(--border-strong); color: var(--text-dim);
    white-space: nowrap;
  }
  .tag.ok { border-color: var(--accent); color: var(--accent); }
  .tag.bad { border-color: var(--danger); color: var(--danger); }
  .tag.run { border-color: #fbbf24; color: #fbbf24; }

  .log-panel { flex: 1; display: flex; flex-direction: column; min-height: 8rem; }
  #log {
    flex: 1; margin: 0; overflow: auto; white-space: pre-wrap; word-break: break-all;
    font: 12.5px/1.65 ui-monospace, Consolas, monospace; color: var(--text-dim);
  }
  #log .ok { color: var(--accent); }
  #log .err { color: var(--danger); }
  #log .gap { color: #fbbf24; }

  /* 输出区：每个词一张卡，卡内分层（正文常显，故事/JSON 折叠） */
  .card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: .75rem; padding: .85rem 1.1rem; margin-bottom: .9rem;
  }
  .card[data-state="fail"] { border-color: var(--danger); }
  .card-head { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
  .card-head b { font-size: 1.2rem; color: var(--accent); }
  .zh { margin: .55rem 0 0; line-height: 1.75; white-space: pre-wrap; }
  .fam { margin-top: .6rem; display: flex; flex-wrap: wrap; gap: .4rem; }
  .chip {
    background: var(--bg); border: 1px solid var(--border-strong);
    border-radius: 999px; padding: .12rem .6rem; font-size: .85rem;
  }
  .chip b { color: var(--accent); font-weight: 600; }
  .origin { margin: .6rem 0 0; color: var(--text-dim); font-size: .92rem; }
  .path { margin: .3rem 0 0; font: 13px/1.6 ui-monospace, Consolas, monospace; color: var(--text-dim); }
  details { margin-top: .5rem; }
  summary { cursor: pointer; color: var(--text-dim); font-size: .85rem; user-select: none; }
  details pre {
    margin: .4rem 0 0; padding: .55rem .7rem; background: var(--bg);
    border: 1px solid var(--border); border-radius: .5rem;
    font: 12.5px/1.6 ui-monospace, Consolas, monospace;
    white-space: pre-wrap; word-break: break-all; max-height: 18rem; overflow: auto;
  }
  .empty { color: var(--text-dim); text-align: center; margin-top: 3rem; font-size: .9rem; }
</style>
</head>
<body>
<header class="top">
  <h1 class="title">LLM 测试台</h1>
  <span class="meta">开发专用（不部署）· /llm 同源反代 · promptV <span id="pv">–</span></span>
  <a class="back" href="./">回主站 ↗</a>
</header>

<div class="shell">
  <div class="left">
    <section class="panel">
      <h2>词单</h2>
      <textarea id="words" spellcheck="false" placeholder="用分号分隔，与进度一键复制一致">account; tear; row; lie</textarea>
      <div class="row" style="margin-top:.55rem">
        <span class="tag" id="wc">4 词</span>
        <label class="opt"><input type="checkbox" id="withPhrases" checked> 注入官方短语家族</label>
        <span class="dim">可直接粘贴复制来的词单</span>
      </div>
    </section>

    <section class="panel">
      <h2>配置</h2>
      <div class="grid2">
        <label>端点 <input type="url" id="baseUrl" class="mono" value="/llm/v1" spellcheck="false"></label>
        <label>model <input type="text" id="model" value="agnes-3.0-flash" spellcheck="false"></label>
        <label>key <input type="password" id="apiKey" class="mono" value="PROXY_MANAGED" spellcheck="false"></label>
        <label>限速间隔 ms <input type="text" id="minGap" class="mono" value="6500" spellcheck="false"></label>
      </div>
      <div class="row" style="margin-top:.7rem">
        <button id="run" class="primary">生成整单</button>
        <button id="stop" disabled>停止</button>
        <button id="clearLog">清日志</button>
        <button id="clearOut">清输出</button>
        <span id="status" class="tag">待命</span>
      </div>
    </section>

    <section class="panel log-panel">
      <h2>日志</h2>
      <pre id="log"></pre>
    </section>
  </div>

  <div class="right" id="right">
    <div class="empty" id="empty">输出区 —— 左侧填词单，点「生成整单」</div>
    <div id="cards"></div>
  </div>
</div>

<script type="module">
import { chat, LlmError } from './js/llm/client.js';
import { buildWordExtPrompt, parseWordExt, PROMPT_VERSION } from './js/llm/prompts.js';
import { validateWordExt } from './js/llm/validate.js';
import { createQueue } from './js/llm/ratelimit.js';

const $ = id => document.getElementById(id);
const logEl = $('log');
const cardsEl = $('cards');
let pack = null;
let busy = false;
let stopFlag = false;

$('pv').textContent = PROMPT_VERSION;

/** 分号分隔（与进度一键复制 join('; ') 一致），另容忍中文分号/逗号/换行；词内空格保留（短语） */
function parseWords(raw) {
  const out = [];
  const seen = new Set();
  for (const part of String(raw).split(/[;；\n,，]+/)) {
    const w = part.trim();
    if (!w || seen.has(w.toLowerCase())) continue;
    seen.add(w.toLowerCase());
    out.push(w);
  }
  return out;
}

function syncCount() { $('wc').textContent = `${parseWords($('words').value).length} 词`; }
$('words').addEventListener('input', syncCount);
syncCount();

function log(line, cls) {
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = line + '\n';
  logEl.appendChild(span);
  logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(text, cls) {
  const el = $('status');
  el.textContent = text;
  el.className = 'tag' + (cls ? ` ${cls}` : '');
}

function cfg() {
  return {
    baseUrl: $('baseUrl').value.trim(),
    model: $('model').value.trim(),
    apiKey: $('apiKey').value.trim(),
  };
}

async function loadPack() {
  if (pack) return pack;
  const res = await fetch('./data/words.v2.json');
  if (!res.ok) throw new Error(`词包加载失败 HTTP ${res.status}`);
  const data = await res.json();
  const byKey = new Map(data.words.map(w => [w.k, w]));
  const members = new Map();
  for (const w of data.words) {
    for (const e of w.entries || []) {
      if (!members.has(e)) members.set(e, []);
      members.get(e).push(w.k);
    }
  }
  pack = {
    byKey,
    phrasesOf(k) {
      const out = new Set();
      const word = byKey.get(k);
      for (const e of (word && word.entries) || []) {
        for (const m of members.get(e) || []) if (m !== k) out.add(m);
      }
      return [...out].sort();
    },
  };
  return pack;
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

function makeCard(key) {
  const card = el('article', 'card');
  card.dataset.state = 'run';
  card.append(
    el('div', 'card-head', null),
    el('p', 'zh', '生成中…'),
  );
  const head = card.firstChild;
  head.append(el('b', null, key), el('span', 'tag run', '排队中'));
  $('empty').hidden = true;
  cardsEl.appendChild(card);
  card.scrollIntoView({ block: 'nearest' });
  return card;
}

function fillCard(card, key, stats, result, raw, failMsg) {
  const head = card.firstChild;
  const tag = head.querySelector('.tag');
  const zhP = card.querySelector('.zh');

  if (failMsg) {
    card.dataset.state = 'fail';
    tag.className = 'tag bad';
    tag.textContent = '失败';
    zhP.textContent = failMsg;
    return;
  }

  const c = result.cleaned;
  card.dataset.state = 'ok';
  tag.className = 'tag ok';
  tag.textContent = stats;
  zhP.textContent = c.zh;

  const fam = el('div', 'fam');
  if (c.family.length) {
    for (const f of c.family) {
      const chip = el('span', 'chip');
      chip.append(el('b', null, f.w), ` ${f.zh}`);
      fam.appendChild(chip);
    }
  } else {
    fam.appendChild(el('span', 'dim', 'family：[]（没有合适的家族词，不硬拗）'));
  }
  card.appendChild(fam);

  const origin = el('p', 'origin', `词源：${c.etymology.origin || '（无）'}`);
  card.appendChild(origin);
  card.appendChild(el('p', 'path', c.etymology.path.map(p => `${p.form}（${p.lang}·${p.meaning}）`).join(' → ')));

  if (c.etymology.story) {
    const d = el('details');
    d.append(el('summary', null, `演变故事 · ${c.etymology.story.length} 字（点开）`), el('p', 'zh', c.etymology.story));
    card.appendChild(d);
  }

  const dRaw = el('details');
  dRaw.append(el('summary', null, '原始输出'), el('pre', null, raw));
  card.appendChild(dRaw);

  const notes = [];
  if (result.errors.length) notes.push(`校验错误：${result.errors.join('；')}`);
  if (result.dropped.length) notes.push(`剔除：${result.dropped.map(d => `${d.w}（${d.why}）`).join('；')}`);
  if (notes.length) {
    const dNote = el('details');
    dNote.append(el('summary', null, '清洗与校验'), el('pre', null, notes.join('\n')));
    card.appendChild(dNote);
  }
}

$('clearLog').onclick = () => { logEl.textContent = ''; };
$('clearOut').onclick = () => {
  cardsEl.textContent = '';
  $('empty').hidden = false;
};

$('stop').onclick = () => {
  stopFlag = true;
  $('stop').disabled = true;
  setStatus('停止中…', 'run');
};

$('run').onclick = async () => {
  if (busy) return;
  const keys = parseWords($('words').value);
  if (!keys.length) { setStatus('词单为空', 'bad'); return; }

  busy = true;
  stopFlag = false;
  $('run').disabled = true;
  $('stop').disabled = false;

  const gapMs = Number($('minGap').value) || 6500;
  const t00 = Date.now();
  let ok = 0, fail = 0;

  try {
    log(`▶ 整单 ${keys.length} 词 · 限速 ${gapMs}ms · promptV ${PROMPT_VERSION}`);
    const p = await loadPack();
    const push = createQueue({ minIntervalMs: gapMs });

    for (let i = 0; i < keys.length; i += 1) {
      if (stopFlag) { log('■ 已手动停止', 'err'); break; }
      const key = keys[i].toLowerCase();
      const word = p.byKey.get(key);
      setStatus(`生成中 ${i + 1}/${keys.length}`, 'run');

      if (!word) {
        fail += 1;
        const card = makeCard(key);
        fillCard(card, key, '', null, '', `词包里没有 "${key}"（wordKey，小写；短语带空格也算）`);
        log(`[${i + 1}/${keys.length}] ${key} ✗ 词包无此词`, 'err');
        continue;
      }

      const card = makeCard(key);
      const phrases = $('withPhrases').checked ? p.phrasesOf(word.k) : [];
      let started = 0;
      try {
        // 队列在内部保证两次发起的间隔 ≥ 限速（等够再发），这里只量请求本身
        const content = await push(() => {
          started = Date.now();
          return chat(buildWordExtPrompt(word, phrases), cfg(), { json: true, timeoutMs: 90000 });
        });
        const cost = ((Date.now() - started) / 1000).toFixed(1);
        const result = validateWordExt(parseWordExt(content), word.k);
        if (result.ok) ok += 1; else fail += 1;
        const stats = `✓ ${cost}s${result.ok ? '' : ' · 校验未过'}`;
        fillCard(card, key, stats, result, content, null);
        log(`[${i + 1}/${keys.length}] ${key} ✓ ${cost}s${result.ok ? '' : ` · 校验未过：${result.errors.join('；')}`}`, result.ok ? 'ok' : 'err');
        if (result.dropped.length) {
          result.dropped.forEach(d => log(`  − 剔除 ${d.w}：${d.why}`));
        }
      } catch (err) {
        fail += 1;
        const code = err instanceof LlmError ? `[${err.code}] ` : '';
        fillCard(card, key, '', null, '', `${code}${err.message}`);
        log(`[${i + 1}/${keys.length}] ${key} ✗ ${code}${err.message}`, 'err');
        if (err instanceof LlmError && err.code === 'NETWORK') {
          log('  网络/反代不通，后面不再试', 'err');
          break;
        }
      }
    }

    const total = ((Date.now() - t00) / 1000).toFixed(0);
    log(`── 完成 ✓${ok} ✗${fail} · 总耗时 ${total}s ──`, fail ? 'err' : 'ok');
    setStatus(stopFlag ? `已停止 ✓${ok} ✗${fail}` : `完成 ✓${ok} ✗${fail}`, fail ? 'bad' : 'ok');
  } catch (err) {
    log(`✗ ${err.message}`, 'err');
    setStatus('失败', 'bad');
    if (err instanceof LlmError && err.code === 'NETWORK') {
      log('  提示：确认 npm start 的 serve.mjs 在跑、LLM 上游已启动（LLM_UPSTREAM 可改地址）');
    }
  } finally {
    busy = false;
    $('run').disabled = false;
    $('stop').disabled = true;
    $('stop').textContent = '停止';
  }
};
</script>
</body>
</html>
